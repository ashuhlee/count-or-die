name: Bug report
description: Something in Count or Die isn't working the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Count or Die better! One bug per report, please.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the [open and closed issues](https://github.com/ashuhlee/count-or-die/issues?q=is%3Aissue) and this bug hasn't been reported yet
          required: true
        - label: I'm on the latest version of the game
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where are you playing?
      options:
        - Windows (64-bit)
        - Windows (32-bit)
        - macOS
        - Web (play.countordie.gg)
        - Web (itch.io)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Game version
      description: Desktop version number, e.g. 1.0.0-beta.1.1. Leave blank if you play in the browser.
      placeholder: 1.0.0-beta.1.1

  - type: input
    id: system
    attributes:
      label: Operating system and browser
      description: e.g. Windows 11, macOS 15, Chrome 130. Add the browser if you play on the web.
      placeholder: macOS 15, Safari 18

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Explain what went wrong. If you received an error message, please include it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Start Classic Mode
        2. Click the numbers until...
        3. See the bug
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag and drop images or a short clip here. They help a lot.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: How often it happens, your score or level, other apps running, etc.
